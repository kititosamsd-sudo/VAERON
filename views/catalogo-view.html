<!-- ── Main: Catálogo (galería de imágenes) ── -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">
      <h1>Catálogo</h1>
      <p>Galería de imágenes de productos</p>
    </div>
    <div class="topbar-actions">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="catalogoSearchInput" placeholder="Buscar producto o código…" oninput="filterCatalogo()">
      </div>
    </div>
  </div>

  <div class="page-content">

    <div class="catalogo-grid" id="catalogoGrid"></div>

    <div class="empty-state" id="catalogoEmptyState" style="display:none">
      <svg class="empty-state-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>Sin productos que coincidan.</p>
    </div>
    <div class="table-footer">
      <span class="table-footer-text" id="catalogoFooterInfo">Cargando…</span>
    </div>

  </div>
</main>

<!-- ── Modal: Ver imagen ── -->
<!-- Misma modal que usa Stock (mismos ids) — openImageView() en
     stock.js es una función global compartida por toda la SPA, así
     que solo hace falta que el HTML del modal exista en la vista
     que está montada en cada momento (ver router.js: una sola vista
     vive en #viewRoot a la vez). -->
<div class="modal-overlay" id="imageViewModal" onclick="outsideClose(event,'imageViewModal')">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div>
        <h2 id="imageViewName">Imagen</h2>
      </div>
      <button class="modal-close" onclick="closeModal('imageViewModal')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" style="text-align:center">
      <img id="imageViewImg" src="" alt="" style="max-width:100%;max-height:60vh;border-radius:var(--r-md);object-fit:contain">
    </div>
    <div class="modal-footer" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('imageViewModal')">Cerrar</button>
      <button class="btn btn-ghost" id="imageViewShare" style="display:none" onclick="compartirImagenActual()">Compartir</button>
      <a class="btn btn-primary" id="imageViewDownload" href="" target="_blank" rel="noopener">Descargar</a>
    </div>
  </div>
</div>
