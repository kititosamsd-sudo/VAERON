<!-- ── Main: Catálogo (galería de imágenes) ── -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">
      <h1>Catálogo</h1>
      <p id="catalogoSubtitle">Galería de imágenes de productos</p>
    </div>
    <div class="topbar-actions">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="catalogoSearchInput" placeholder="Buscar producto o código…" oninput="filterCatalogo()">
      </div>
    </div>
  </div>

  <div class="page-content">

    <!-- ── Completitud de fotos ── -->
    <div class="catalogo-progress">
      <div class="catalogo-progress-head">
        <span>Completitud de fotos</span>
        <span class="catalogo-progress-value" id="catalogoProgressValue">—</span>
      </div>
      <div class="catalogo-progress-track">
        <div class="catalogo-progress-fill" id="catalogoProgressFill"></div>
      </div>
    </div>

    <!-- ── Filtros, orden y modo de vista ── -->
    <div class="catalogo-toolbar">
      <div class="catalogo-tabs" id="catalogoTabs">
        <button class="catalogo-tab active" data-filter="all" onclick="setCatalogoFilter('all')">Todas</button>
        <button class="catalogo-tab" data-filter="withImage" onclick="setCatalogoFilter('withImage')">Con foto</button>
        <button class="catalogo-tab" data-filter="noImage" onclick="setCatalogoFilter('noImage')">
          Sin foto <span class="catalogo-tab-count" id="catalogoNoImageCount">0</span>
        </button>
      </div>
      <div class="catalogo-toolbar-right">
        <div class="catalogo-sort-wrap">
          <button class="btn btn-ghost btn-sm" id="btnCatalogoSort" onclick="toggleCatalogoSortMenu(event)">
            <span id="catalogoSortLabel">Recientes</span>
            <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div class="catalogo-sort-menu" id="catalogoSortMenu">
            <button onclick="setCatalogoSort('recent')">Recientes</button>
            <button onclick="setCatalogoSort('nameAsc')">Nombre (A-Z)</button>
            <button onclick="setCatalogoSort('nameDesc')">Nombre (Z-A)</button>
          </div>
        </div>
        <div class="catalogo-view-toggle">
          <button class="active" id="btnCatalogoViewGrid" onclick="setCatalogoView('grid')" title="Vista de grilla">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          </button>
          <button id="btnCatalogoViewList" onclick="setCatalogoView('list')" title="Vista de lista">
            <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="catalogo-grid" id="catalogoGrid"></div>

    <div class="empty-state" id="catalogoEmptyState" style="display:none">
      <svg class="empty-state-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <p>Sin productos que coincidan.</p>
    </div>
    <div class="table-footer">
      <span class="table-footer-text" id="catalogoFooterInfo">Cargando…</span>
    </div>

  </div>
</main>

<!-- ── Modal: Ver imagen ── -->
<!-- Misma modal que usa Stock (mismos ids) — openImageView() en
     stock.js es una función global compartida por toda la SPA, así
     que solo hace falta que el HTML del modal exista en la vista
     que está montada en cada momento (ver router.js: una sola vista
     vive en #viewRoot a la vez). -->
<div class="modal-overlay" id="imageViewModal" onclick="outsideClose(event,'imageViewModal')">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <div>
        <h2 id="imageViewName">Imagen</h2>
      </div>
      <button class="modal-close" onclick="closeModal('imageViewModal')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" style="text-align:center">
      <img id="imageViewImg" src="" alt="" style="max-width:100%;max-height:60vh;border-radius:var(--r-md);object-fit:contain">
    </div>
    <div class="modal-footer" style="justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeModal('imageViewModal')">Cerrar</button>
      <button class="btn btn-ghost" id="imageViewShare" style="display:none" onclick="compartirImagenActual()">Compartir</button>
      <a class="btn btn-primary" id="imageViewDownload" href="" target="_blank" rel="noopener">Descargar</a>
    </div>
  </div>
</div>
