<!-- ── Main: Foro entre tiendas ── -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">
      <h1>Foro entre tiendas</h1>
      <p>Publica o busca productos de otras tiendas — vendo/busco por categoría.</p>
    </div>
    <button class="btn btn-primary" onclick="abrirNuevaPublicacionForo()">+ Nueva publicación</button>
  </div>

  <div class="page-content">
    <div class="warehouse-tabs" id="foroCategoriaTabs">
      <button class="warehouse-tab active" data-cat="" onclick="filtrarForoCategoria('')">Todas</button>
    </div>

    <div id="foroLista" class="catalogo-grid"></div>
    <div id="foroEmpty" style="display:none;text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px">
      Todavía no hay publicaciones en esta categoría.
    </div>
  </div>
</main>

<!-- ── Modal: nueva publicación ── -->
<div class="modal-overlay" id="foroModal" onclick="outsideClose(event,'foroModal')">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2>Nueva publicación</h2>
        <p style="font-size:12px;color:var(--text-3);margin-top:2px">Se publica a nombre de tu tienda, visible para las demás</p>
      </div>
      <button class="modal-close" onclick="closeModal('foroModal')">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <select class="form-input" id="foroTipo">
          <option value="vendo">Vendo</option>
          <option value="busco">Busco</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Categoría</label>
        <select class="form-input" id="foroCategoria"></select>
      </div>
      <div class="form-group">
        <label class="form-label">Título</label>
        <input class="form-input" id="foroTitulo" type="text" maxlength="80" placeholder="Ej: Guitarra Fender Stratocaster">
      </div>
      <div class="form-group">
        <label class="form-label">Precio (opcional)</label>
        <input class="form-input text-mono" id="foroPrecio" type="number" min="0" step="0.01" placeholder="0.00">
      </div>
      <div class="form-group">
        <label class="form-label">Descripción</label>
        <textarea class="form-input" id="foroDescripcion" rows="4" maxlength="500" placeholder="Detalles, estado, forma de contacto..."></textarea>
      </div>
      <p id="foroModalMsg" class="settings-msg"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('foroModal')">Cancelar</button>
      <button class="btn btn-primary" id="btnPublicarForo" onclick="enviarPublicacionForo()">Publicar</button>
    </div>
  </div>
</div>
