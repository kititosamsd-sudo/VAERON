<!-- ── Main: Facturación (solo súper-admin) ── -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">
      <h1>Facturación</h1>
      <p>Plan, monto mensual y estado de pago de cada tienda</p>
    </div>
  </div>

  <div class="page-content">

    <div class="stock-stats" id="factStatsRow">
      <div class="stat-card">
        <div class="stat-label">Ingreso mensual estimado</div>
        <div class="stat-value" id="statFactIngreso">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Al día</div>
        <div class="stat-value" style="color:#047857" id="statFactAlDia">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pendientes / vencidas</div>
        <div class="stat-value" style="color:var(--red)" id="statFactPendientes">—</div>
      </div>
    </div>

    <div class="product-table-wrap simple-table-wrap">
      <table class="product-table">
        <thead>
          <tr>
            <th>Tienda</th>
            <th>Plan</th>
            <th>Monto mensual</th>
            <th>Próximo cobro</th>
            <th>Estado de pago</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="facturacionTableBody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="facturacionEmptyState" style="display:none">
      <svg class="empty-state-icon" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
      <p>Todavía no hay tiendas registradas.</p>
    </div>

  </div>
</main>

<!-- ── Modal: Editar facturación de una tienda ── -->
<div class="modal-overlay" id="facturacionModal" onclick="outsideClose(event,'facturacionModal')">
  <div class="modal">
    <div class="modal-header">
      <div>
        <h2>Editar facturación</h2>
        <p id="facturacionModalTienda" style="font-size:12px;color:var(--text-3);margin-top:2px"></p>
      </div>
      <button class="modal-close" onclick="closeModal('facturacionModal')">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Plan</label>
        <select class="form-input" id="facturacionPlan">
          <option value="basico">Básico</option>
          <option value="medio">Medio</option>
          <option value="premium">Premium</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Monto mensual (S/)</label>
        <input class="form-input text-mono" id="facturacionMonto" type="number" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label class="form-label">Próximo cobro</label>
        <input class="form-input" id="facturacionProximoCobro" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">Estado de pago</label>
        <select class="form-input" id="facturacionEstadoPago">
          <option value="al_dia">Al día</option>
          <option value="pendiente">Pendiente</option>
          <option value="vencido">Vencido</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('facturacionModal')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarFacturacionDesdeForm()">Guardar cambios</button>
    </div>
  </div>
</div>
