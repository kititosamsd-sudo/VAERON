<!-- ── Main: Nota de Pedido ── -->
<main class="main">
  <div class="topbar">
    <div class="topbar-title">
      <h1>Nueva Nota de Pedido</h1>
    </div>
    <div class="topbar-actions">
      <span class="nota-numero-badge" id="notaSubtitulo">Nueva</span>
      <button class="btn btn-ghost" onclick="Router.go('pedidos')">
        <svg viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Volver
      </button>
    </div>
  </div>

  <div class="page-content">

    <div id="notaAlertBox" style="display:none;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;padding:10px 14px;background:var(--red-bg);border:1px solid #FECACA;border-radius:var(--r-sm);font-size:12.5px;color:var(--red)">
      <span id="notaAlertMsg"></span>
      <button type="button" class="btn btn-ghost" id="notaAlertRetryBtn" style="height:26px;padding:0 10px;font-size:11.5px;flex-shrink:0" onclick="reintentarNumeroNota()">Reintentar</button>
    </div>

    <div class="nota-grid">
      <div class="nota-main">

        <div class="settings-card nota-cliente-card">
          <div id="notaClienteBuscador" style="width:100%">
            <div class="search-wrap" style="max-width:420px">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="notaClienteSearch" placeholder="Buscar cliente por RUC o razón social…" oninput="buscarClienteNota(this.value)" autocomplete="off">
            </div>
            <div id="notaClienteResultados" class="nota-autocomplete" style="display:none"></div>

            <div class="nota-cliente-o"><span>o</span></div>

            <button class="btn btn-ghost" id="btnAbrirCrearClienteNota" onclick="abrirCrearClienteNota()">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Crear con nombre, RUC o DNI
            </button>

            <div id="notaClienteCrearForm" style="display:none;margin-top:10px">
              <div class="nota-descuento-pills" style="margin-bottom:8px">
                <button type="button" class="nota-pill" data-tipo="nombre" onclick="setTipoClienteNota('nombre')">Nombre</button>
                <button type="button" class="nota-pill" data-tipo="ruc" onclick="setTipoClienteNota('ruc')">RUC</button>
                <button type="button" class="nota-pill" data-tipo="dni" onclick="setTipoClienteNota('dni')">DNI</button>
              </div>
              <div class="search-wrap" style="max-width:420px">
                <input type="text" id="notaClienteValorInput" placeholder="Elige un dato arriba primero…" disabled>
              </div>
              <div style="display:flex;gap:8px;margin-top:10px">
                <button class="btn btn-ghost" style="height:32px;padding:0 14px;font-size:12.5px" onclick="cancelarCrearClienteNota()">Cancelar</button>
                <button class="btn btn-primary" style="height:32px;padding:0 14px;font-size:12.5px" onclick="confirmarCrearClienteNota()">Usar este cliente</button>
              </div>
            </div>
          </div>

          <div id="notaClienteInfo" class="nota-cliente-info-row" style="display:none">
            <div class="nota-cliente-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </div>
            <div class="nota-cliente-textos">
              <div class="nota-cliente-nombre" id="notaClienteNombre"></div>
              <div class="nota-cliente-ruc" id="notaClienteSubinfo"></div>
            </div>
            <button class="btn btn-ghost" style="height:30px;padding:0 12px;font-size:12px" onclick="quitarClienteNota()">Cambiar</button>
          </div>
        </div>

        <div class="settings-card">
          <h3 class="cfg-group-heading">Agregar artículo</h3>
          <div class="nota-add-row">
            <div class="nota-add-field nota-add-producto">
              <label class="form-label">Producto</label>
              <div class="search-wrap">
                <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="notaProductoSearch" placeholder="Buscar por nombre o código…" oninput="buscarProductoNota(this.value)" autocomplete="off">
              </div>
              <div id="notaProductoResultados" class="nota-autocomplete" style="display:none"></div>
            </div>
            <div class="nota-add-field">
              <label class="form-label">Cantidad</label>
              <input class="form-input" id="notaCantidadInput" type="number" min="1" step="1" value="1">
            </div>
            <div class="nota-add-field">
              <label class="form-label">Precio unit.</label>
              <input class="form-input" id="notaPrecioInput" type="number" min="0" step="0.01" placeholder="0.00">
            </div>
            <button class="btn btn-primary" onclick="anadirItemNota()">+ Añadir</button>
          </div>
        </div>

        <div class="settings-card">
          <div class="nota-section-head">
            <h3 class="cfg-group-heading">Artículos del pedido</h3>
            <span class="nota-count-badge" id="notaItemCount">0</span>
          </div>

          <div id="notaEmptyItems" class="nota-empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
            <p>Aún no hay artículos. Agrega un producto para comenzar.</p>
          </div>
          <div id="notaItemsHeader" class="nota-item-row-header" style="display:none">
            <span class="nota-item-info">Producto</span>
            <span>Cant.</span>
            <span>Precio unit.</span>
            <span class="nota-item-subtotal">Subtotal</span>
            <span style="width:26px"></span>
          </div>
          <div id="notaItemsList" style="display:none"></div>
        </div>

      </div>

      <div class="nota-sidebar">
        <div class="settings-card nota-resumen-card">
          <h3 class="cfg-group-heading">Resumen del pedido</h3>
          <div class="nota-resumen-row"><span>Subtotal</span><span id="notaSubtotal">S/ 0.00</span></div>
          <div class="nota-resumen-row nota-resumen-total"><span>Total</span><span id="notaTotal">S/ 0.00</span></div>

          <div class="nota-descuento-block">
            <h4 class="cfg-group-heading">Descuento</h4>
            <div class="nota-descuento-pills">
              <button type="button" class="nota-pill" data-pct="5" onclick="setDescuentoNota(5)">5%</button>
              <button type="button" class="nota-pill" data-pct="10" onclick="setDescuentoNota(10)">10%</button>
              <button type="button" class="nota-pill" data-pct="15" onclick="setDescuentoNota(15)">15%</button>
              <button type="button" class="nota-pill" data-pct="20" onclick="setDescuentoNota(20)">20%</button>
            </div>
            <div class="nota-descuento-custom">
              <input class="form-input" id="notaDescuentoInput" type="number" min="0" max="100" step="0.1" value="0" oninput="setDescuentoNota(this.value)">
              <span>%</span>
            </div>
          </div>

          <button class="btn btn-primary nota-confirm-btn" id="btnGuardarNota" onclick="guardarNota()">Confirmar pedido</button>
        </div>
      </div>

    </div>
  </div>
</main>
