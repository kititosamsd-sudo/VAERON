<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — VAERON</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="variables.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- SDK real de Firebase (compat) — ver el mismo comentario en index.html -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  /* =========================================================
     Login — VAERON (v2)
     =========================================================
     Se abandona el layout de dos paneles con tarjeta blanca: era
     mucho texto y leía a plantilla de SaaS genérica. Ahora es una
     sola escena a pantalla completa — el fondo real es el propio
     monograma de la marca usado como textura gigante (no una foto
     de stock de biblioteca), con el acero cepillado y el resplandor
     azul del logo. El formulario no vive dentro de una tarjeta:
     flota directo sobre el fondo, con campos translúcidos con borde,
     como una consola de acceso, no un formulario de registro. El
     título es grande y es lo primero que se lee — el resto del
     texto se redujo a una sola línea.
     ========================================================= */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; min-height: 100vh;
    font-family: var(--font-ui);
    background: var(--sb-bg);
    color: #fff;
    overflow-x: hidden;
  }

  /* ── Navbar: fija arriba, transparente sobre la escena. Como la
       marca ya vive acá, el bloque central ya no repite logo+wordmark
       — solo el título. ── */
  .navbar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    height: 68px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px;
    background: linear-gradient(180deg, rgba(10,12,16,0.72) 0%, rgba(10,12,16,0.30) 80%, transparent 100%);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .navbar-brand { display: flex; align-items: center; gap: 10px; }
  .navbar-brand img { width: 26px; height: auto; filter: drop-shadow(0 2px 10px rgba(47,125,255,0.4)); }
  .navbar-brand .nb-word { font-family: var(--font-mono); font-weight: 700; font-size: 13px; letter-spacing: 0.18em; color: #fff; }
  .navbar-links { display: flex; align-items: center; gap: 28px; }
  .navbar-links a {
    font-size: 12.5px; font-weight: 500; color: #9AA3B2; text-decoration: none;
    margin-right: 28px;
    transition: color var(--t);
  }
  .navbar-links a:last-of-type { margin-right: 0; }
  .navbar-links a:hover { color: #fff; }
  .navbar-links .nb-status {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; color: #6E7889;
    padding-left: 22px; border-left: 1px solid rgba(255,255,255,0.10);
  }
  .navbar-links .nb-status .dot { width: 5px; height: 5px; border-radius: 50%; background: #34C77B; box-shadow: 0 0 0 3px rgba(52,199,123,0.20); }

  @media (max-width: 620px) {
    .navbar { padding: 0 18px; height: 60px; }
    .navbar-links a { display: none; }
  }

  .scene {
    position: relative;
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: 100px 32px 32px;
    isolation: isolate;
    /* El watermark (.logo-watermark) es una imagen gigante (1000px)
       posicionada con right/bottom negativos para que sangre fuera
       del encuadre — a propósito, es un efecto decorativo. Pero sin
       overflow:hidden acá, esa imagen igual empuja el scroll de la
       página: en celular quedaba un área en blanco, del tamaño de la
       parte de la imagen que sobresalía, debajo del formulario —
       daba la sensación de que la pantalla de login "seguía" cuando
       en realidad no había más contenido. */
    overflow: hidden;
  }

  /* ── Fondo: acero cepillado + resplandor azul + el propio logo
       gigante como textura, sangrado fuera del encuadre ── */
  .scene::before {
    content: ''; position: absolute; inset: 0; z-index: -3;
    background:
      radial-gradient(ellipse 900px 700px at 82% 8%, rgba(47,125,255,0.20) 0%, transparent 60%),
      radial-gradient(ellipse 700px 600px at 10% 95%, rgba(26,70,196,0.14) 0%, transparent 60%),
      var(--sb-bg);
  }
  .scene::after {
    content: ''; position: absolute; inset: 0; z-index: -2; pointer-events: none;
    background-image: repeating-linear-gradient(
      112deg,
      rgba(255,255,255,0.030) 0px,
      rgba(255,255,255,0.030) 1px,
      transparent 1px,
      transparent 3px
    );
  }
  .logo-watermark {
    position: absolute; z-index: -1; pointer-events: none; user-select: none;
    width: 1000px; max-width: none;
    right: -260px; bottom: -220px;
    opacity: 0.07;
    transform: rotate(-6deg);
  }

  .login-console {
    position: relative;
    width: 100%; max-width: 380px;
    display: flex; flex-direction: column; align-items: center;
  }

  .console-brand { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
  .console-brand img { width: 46px; height: auto; filter: drop-shadow(0 4px 18px rgba(47,125,255,0.45)); margin-bottom: 14px; }
  .console-brand .wordmark {
    font-family: var(--font-mono); font-weight: 700; font-size: 14px;
    letter-spacing: 0.22em; color: #fff; margin-bottom: 3px;
  }
  .console-brand .sub {
    font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: #626C7C;
  }

  .console-title {
    font-family: var(--font-ui); font-weight: 800;
    font-size: 34px; letter-spacing: -0.02em; line-height: 1.05;
    color: #fff; text-align: center; margin-bottom: 10px;
  }
  .console-title span { color: var(--accent-bright); }
  .console-tagline {
    font-size: 13px; color: #8992A3; text-align: center; line-height: 1.5;
    margin-bottom: 30px; max-width: 300px;
  }

  form { width: 100%; }

  .field-group { position: relative; margin-bottom: 13px; }
  .field-group svg {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; stroke: #6B7484; fill: none; stroke-width: 1.8;
    pointer-events: none;
  }
  .field-group input {
    width: 100%; height: 48px; border-radius: var(--r);
    border: 1.5px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    padding: 0 16px 0 42px; font-size: 14px; font-family: var(--font-ui);
    color: #fff; outline: none;
    transition: border-color var(--t), box-shadow var(--t), background var(--t);
  }
  .field-group input:focus {
    background: rgba(255,255,255,0.07);
    border-color: var(--accent-bright);
    box-shadow: 0 0 0 3px rgba(47,125,255,0.16);
  }
  .field-group input::placeholder { color: #626C7C; }
  .toggle-pw {
    position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 4px;
    display: flex; touch-action: manipulation;
  }
  .toggle-pw svg { position: static; transform: none; width: 16px; height: 16px; stroke: #6B7484; fill: none; stroke-width: 1.8; }

  .login-row {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; row-gap: 10px; column-gap: 12px;
    margin: 4px 2px 20px; font-size: 12.5px;
  }
  .login-remember { display: flex; align-items: center; gap: 7px; color: #9AA3B2; cursor: pointer; user-select: none; }
  .login-remember input { width: 15px; height: 15px; accent-color: var(--accent-bright); cursor: pointer; }
  .login-forgot { color: var(--accent-bright); text-decoration: none; cursor: pointer; background: none; border: none; font-size: 12.5px; font-weight: 600; font-family: var(--font-ui); padding: 0; touch-action: manipulation; }
  .login-forgot:hover { text-decoration: underline; }

  .btn-login {
    width: 100%; height: 50px; border-radius: var(--r);
    background: linear-gradient(165deg, var(--accent-bright) 0%, var(--accent) 46%, var(--accent-hover) 100%);
    color: #fff; border: none;
    font-size: 14.5px; font-weight: 700; font-family: var(--font-ui);
    cursor: pointer; touch-action: manipulation;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 12px 28px rgba(26,70,196,0.38), inset 0 1px 0 rgba(255,255,255,0.22);
    transition: filter var(--t), transform 0.08s, box-shadow var(--t);
  }
  .btn-login:hover { filter: brightness(1.08); }
  .btn-login:active { transform: scale(0.99); }
  .btn-login:disabled { opacity: 0.55; cursor: default; transform: none; box-shadow: none; }
  .btn-login svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }

  .login-error, .login-info {
    display: none;
    font-size: 12.5px; border-radius: var(--r-sm); padding: 10px 14px;
    margin-bottom: 16px; text-align: center;
  }
  .login-error { background: rgba(178,58,44,0.16); border: 1px solid rgba(178,58,44,0.4); color: #FF9C8A; }
  .login-info  { background: rgba(20,107,76,0.16); border: 1px solid rgba(20,107,76,0.4); color: #6FE0B4; }

  .console-footer {
    margin-top: 26px; text-align: center;
    font-size: 12px; color: #626C7C; line-height: 1.6;
  }
  .console-footer a { color: var(--accent-bright); text-decoration: none; font-weight: 600; }
  .console-footer a:hover { text-decoration: underline; }
  .console-footer .secure {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.06em; color: #4B5464; margin-top: 10px;
  }
  .console-footer .secure svg { width: 12px; height: 12px; stroke: #4B5464; fill: none; stroke-width: 1.8; }

  @media (max-width: 420px) {
    .console-title { font-size: 28px; }
    .logo-watermark { width: 640px; right: -220px; bottom: -160px; }
  }
</style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-brand">
    <img src="logo-vaeron-icon.png" alt="VAERON">
    <span class="nb-word">VAERON</span>
  </div>
  <div class="navbar-links">
    <a href="#" onclick="return false;">Ayuda</a>
    <a href="#" onclick="return false;">Contacto</a>
    <span class="nb-status"><span class="dot"></span>SISTEMA OPERATIVO</span>
  </div>
</nav>

<div class="scene">
  <img class="logo-watermark" src="logo-vaeron-watermark.png" alt="">

  <div class="login-console">
    <h1 class="console-title">Acceso al <span>sistema</span></h1>
    <p class="console-tagline">Ingresa con el correo y la contraseña que te asignó tu administrador.</p>

    <div class="login-error" id="loginError"></div>
    <div class="login-info" id="loginInfo"></div>

    <form id="loginForm">
      <div class="field-group">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 6 10-6"/></svg>
        <input type="email" id="loginIdentifier" placeholder="Correo electrónico" autocomplete="username" required>
      </div>

      <div class="field-group">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="loginPassword" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" class="toggle-pw" id="togglePw" title="Mostrar/ocultar contraseña">
          <svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="login-row">
        <label class="login-remember">
          <input type="checkbox" id="loginRemember" checked>
          Recordarme
        </label>
        <button type="button" class="login-forgot" id="forgotBtn">¿Olvidaste tu contraseña?</button>
      </div>

      <button type="submit" class="btn-login" id="loginSubmit">
        Iniciar sesión
        <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="console-footer">
      ¿No tienes cuenta? <a href="#" id="noAccountHint" onclick="return false;">Pide acceso a tu administrador</a>
      <div class="secure">
        <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        CONEXIÓN CIFRADA
      </div>
    </div>
  </div>
</div>

<script src="firebase-projects.js"></script>
<script src="firebase.js"></script>
<script>
  const form         = document.getElementById('loginForm');
  const identifierEl = document.getElementById('loginIdentifier');
  const pwEl         = document.getElementById('loginPassword');
  const rememberEl   = document.getElementById('loginRemember');
  const errorEl      = document.getElementById('loginError');
  const infoEl       = document.getElementById('loginInfo');
  const submitBtn    = document.getElementById('loginSubmit');
  const forgotBtnEl  = document.getElementById('forgotBtn');

  // Si volvimos aquí porque auth-guard.js cerró la sesión (cuenta
  // deshabilitada, sin perfil configurado, o no se pudo confirmar
  // la sesión), se lo explicamos en vez de dejar un login mudo.
  (function mostrarMotivoRedireccion() {
    const motivo = new URLSearchParams(window.location.search).get('motivo');
    const mensajes = {
      'deshabilitada':   'Tu cuenta fue deshabilitada. Contacta al administrador.',
      'sin-perfil':      'Tu cuenta no tiene un perfil configurado todavía. Contacta al administrador.',
      'error-conexion':  'No se pudo confirmar tu sesión por un problema de conexión. Intenta de nuevo.',
      'tienda-suspendida': 'La tienda de esta cuenta está suspendida. Contacta al administrador.',
    };
    if (motivo && mensajes[motivo]) {
      errorEl.textContent = mensajes[motivo];
      errorEl.style.display = 'block';
    }
  })();

  // ── Bloqueo por intentos fallidos (protección ante fuerza bruta) ──
  // Se lleva por separado para cada correo — 10 intentos fallidos
  // seguidos bloquean el formulario 15 minutos. Esto es nuestro, vive
  // en este navegador; aparte, Firebase tiene su propia protección en
  // el servidor (auth/too-many-requests).
  const MAX_INTENTOS = 10;
  const BLOQUEO_MS = 15 * 60 * 1000;

  function currentIdentifierKey() {
    return 'loginAttempts_' + identifierEl.value.trim().toLowerCase();
  }
  function getAttempts(key) { return parseInt(localStorage.getItem(key + '_count') || '0', 10); }
  function setAttempts(key, n) { localStorage.setItem(key + '_count', String(n)); }
  function clearIntentos(key) { localStorage.removeItem(key + '_count'); localStorage.removeItem(key + '_lockUntil'); }
  function getLockUntil(key) { return parseInt(localStorage.getItem(key + '_lockUntil') || '0', 10); }
  function setLockUntil(key, ts) { localStorage.setItem(key + '_lockUntil', String(ts)); }

  function checkBloqueo() {
    const key = currentIdentifierKey();
    const lockUntil = getLockUntil(key);
    if (lockUntil && Date.now() < lockUntil) {
      const minutos = Math.ceil((lockUntil - Date.now()) / 60000);
      errorEl.textContent = `Demasiados intentos fallidos. Espera ${minutos} minuto(s) e intenta de nuevo.`;
      errorEl.style.display = 'block';
      submitBtn.disabled = true;
      return true;
    }
    submitBtn.disabled = false;
    return false;
  }

  document.getElementById('togglePw').addEventListener('click', () => {
    pwEl.type = pwEl.type === 'password' ? 'text' : 'password';
  });

  // Si ya hay sesión activa, no mostrar el login — ir directo a la app.
  // (auth-guard.js, en index.html y las demás páginas, es quien de
  // verdad decide si esa sesión es válida — aquí solo evitamos
  // mostrar el formulario si claramente ya hay alguien conectado.)
  firebase.auth().onAuthStateChanged(user => {
    if (user) window.location.href = 'index.html';
  });

  function resolveAuthEmail() {
    return identifierEl.value.trim().toLowerCase();
  }

  // Códigos de Firebase que cuentan como "contraseña incorrecta" para
  // efectos del contador de intentos. Errores de red o de formato de
  // correo no deben gastar intentos del usuario.
  const CODIGOS_CONTRASEÑA_INCORRECTA = ['auth/wrong-password', 'auth/invalid-credential', 'auth/user-not-found'];

  form.addEventListener('submit', async e => {
    e.preventDefault();
    errorEl.style.display = 'none';
    infoEl.style.display  = 'none';

    if (checkBloqueo()) return; // bloqueado: ni se intenta
    const idKey = currentIdentifierKey();
    const authEmail = resolveAuthEmail();

    submitBtn.disabled = true;
    submitBtn.textContent = 'Ingresando…';

    try {
      const persistence = rememberEl.checked
        ? firebase.auth.Auth.Persistence.LOCAL
        : firebase.auth.Auth.Persistence.SESSION;

      // Firebase Auth es independiente por proyecto (ver el comentario
      // grande en firebase-projects.js) — antes de poder revisar una
      // contraseña, hay que saber en cuál de los proyectos configurados
      // vive esa cuenta.
      const esSuperAdmin = authEmail === ADMIN_BOOTSTRAP_EMAIL;
      let proyectosConSesion;

      if (esSuperAdmin) {
        // El súper-admin administra TODAS las tiendas, repartidas entre
        // TODOS los proyectos — así que su sesión también vive en todos
        // a la vez (misma cuenta, misma contraseña, creada a mano en
        // cada uno). Si algún proyecto todavía no tiene esa cuenta
        // creada, no se bloquea el ingreso por eso: entra con los que sí
        // respondieron, y ese proyecto en particular simplemente no
        // aparecerá en Tiendas hasta que se cree la cuenta ahí también.
        const claves = allProjectKeys();
        const resultados = await Promise.allSettled(claves.map(key =>
          getProjectApp(key).auth().setPersistence(persistence)
            .then(() => getProjectApp(key).auth().signInWithEmailAndPassword(authEmail, pwEl.value))
        ));
        proyectosConSesion = claves.filter((_, i) => resultados[i].status === 'fulfilled');
        if (proyectosConSesion.length === 0) throw resultados[0].reason;
      } else {
        // Cuenta de tienda: vive en UN solo proyecto — el directorio
        // (armado por crearTienda() en firebase.js al crear la tienda)
        // dice en cuál.
        const proyecto = await buscarProyectoDeCorreo(authEmail);
        if (!proyecto || !FIREBASE_PROJECTS[proyecto]) {
          const err = new Error('No existe esa cuenta.');
          err.code = 'auth/user-not-found';
          throw err;
        }
        await getProjectApp(proyecto).auth().setPersistence(persistence);
        await getProjectApp(proyecto).auth().signInWithEmailAndPassword(authEmail, pwEl.value);
        proyectosConSesion = [proyecto];
      }

      // index.html (y el resto de páginas protegidas) necesitan saber
      // en qué proyecto inicializar su app "por defecto" — ver el
      // comentario grande al inicio de firebase.js.
      const proyectoPorDefecto = esSuperAdmin ? PROYECTO_COORDINADOR : proyectosConSesion[0];
      localStorage.setItem(ADONAY_ACTIVE_PROJECT_KEY, proyectoPorDefecto);
      localStorage.setItem(ADONAY_ACTIVE_PROJECTS_KEY, JSON.stringify(proyectosConSesion));

      // Los signIn de arriba se hicieron contra apps de Firebase CON
      // NOMBRE (getProjectApp) — Firebase guarda la sesión de cada
      // una bajo una llave que incluye ese nombre. index.html (y el
      // resto de páginas protegidas) inicializan en cambio la app
      // "por defecto" (sin nombre, ver arriba de firebase.js), que
      // usa una llave de sesión DISTINTA — así que nunca encontraría
      // la sesión recién creada. Por eso, además de lo de arriba,
      // iniciamos sesión también en la app por defecto del proyecto
      // que quedará activo, para que su sesión sí quede donde
      // index.html la va a buscar.
      const configPorDefecto = FIREBASE_PROJECTS[proyectoPorDefecto].config;
      let appPorDefecto = firebase.apps.find(a => a.name === '[DEFAULT]') || null;
      if (appPorDefecto && appPorDefecto.options.projectId !== configPorDefecto.projectId) {
        await appPorDefecto.delete();
        appPorDefecto = null;
      }
      if (!appPorDefecto) {
        appPorDefecto = firebase.initializeApp(configPorDefecto);
      }
      await appPorDefecto.auth().setPersistence(persistence);
      await appPorDefecto.auth().signInWithEmailAndPassword(authEmail, pwEl.value);

      clearIntentos(idKey); // login correcto: se resetea el contador de esa cuenta
      window.location.href = 'index.html';
    } catch (err) {
      if (CODIGOS_CONTRASEÑA_INCORRECTA.includes(err.code)) {
        const intentos = getAttempts(idKey) + 1;
        if (intentos >= MAX_INTENTOS) {
          setAttempts(idKey, 0);
          setLockUntil(idKey, Date.now() + BLOQUEO_MS);
          submitBtn.textContent = 'Iniciar sesión';
          checkBloqueo(); // pinta el mensaje y bloquea el formulario
          return;
        }
        setAttempts(idKey, intentos);
      }
      errorEl.textContent = traducirErrorAuth(err.code);
      errorEl.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Iniciar sesión';
    }
  });

  // El correo del admin es una bandeja real, por lo que este botón
  // sí puede enviar un correo de restablecimiento — pero antes hay que
  // saber en qué proyecto está esa cuenta (mismo motivo que en el
  // submit de arriba: Firebase Auth es independiente por proyecto).
  forgotBtnEl.addEventListener('click', async () => {
    const email = identifierEl.value.trim().toLowerCase();
    if (!email) {
      errorEl.textContent = 'Escribe primero tu correo arriba.';
      errorEl.style.display = 'block';
      return;
    }
    try {
      const proyecto = email === ADMIN_BOOTSTRAP_EMAIL
        ? PROYECTO_COORDINADOR
        : await buscarProyectoDeCorreo(email);
      if (!proyecto || !FIREBASE_PROJECTS[proyecto]) {
        throw Object.assign(new Error('No existe esa cuenta.'), { code: 'auth/user-not-found' });
      }
      await getProjectApp(proyecto).auth().sendPasswordResetEmail(email);
      errorEl.style.display = 'none';
      infoEl.textContent = 'Te enviamos un correo para restablecer la contraseña.';
      infoEl.style.display = 'block';
    } catch (err) {
      errorEl.textContent = traducirErrorAuth(err.code);
      errorEl.style.display = 'block';
    }
  });

  function traducirErrorAuth(code) {
    const map = {
      'auth/invalid-email':        'El correo no tiene un formato válido.',
      'auth/user-not-found':       'No existe esa cuenta.',
      'auth/wrong-password':       'Contraseña incorrecta.',
      'auth/invalid-credential':   'Correo o contraseña incorrectos. Revisa ambos.',
      'auth/too-many-requests':    'Demasiados intentos. Espera un momento y vuelve a intentar.',
      'auth/network-request-failed': 'Sin conexión a internet. Revisa tu señal.'
    };
    return map[code] || 'No se pudo iniciar sesión. Intenta de nuevo.';
  }
</script>
