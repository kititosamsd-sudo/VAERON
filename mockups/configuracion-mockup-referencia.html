<h2 class="sr-only">Vista previa en modo claro de la página Configuración de VAERON, con un rail de categorías dentro de la propia página y filas agrupadas por color.</h2>
<div style="font-family:'Inter',-apple-system,'Segoe UI',sans-serif;background:#FFFFFF;border:1px solid #E3E6ED;border-radius:16px;box-shadow:0 1px 3px rgba(20,23,29,0.08);overflow:hidden">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:20px 24px 16px;border-bottom:1px solid #E3E6ED">
    <div>
      <div style="font-size:19px;font-weight:650;color:#14171D;letter-spacing:-0.01em">Configuración</div>
      <div style="font-size:13px;color:#8991A0;margin-top:2px">Personaliza tu sistema y tus preferencias.</div>
    </div>
    <span style="font-size:11px;font-weight:650;color:#4A5160;background:#F7F8FB;border:1px solid #E3E6ED;border-radius:999px;padding:4px 11px;white-space:nowrap;margin-top:2px">Plan Básico</span>
  </div>
  <div style="display:flex;min-height:400px">
    <nav id="settingsNav" style="width:172px;flex-shrink:0;background:#F7F8FB;padding:14px 10px;display:flex;flex-direction:column;gap:2px;border-right:1px solid #E3E6ED"></nav>
    <div id="panelContent" style="flex:1;padding:22px 26px"></div>
  </div>
</div>
<script>
const ACCENT = '#1A46C4';
const ACCENT_SOFT = 'rgba(26,70,196,0.09)';
const INK = '#14171D';
const TEXT2 = '#4A5160';
const TEXT3 = '#8991A0';
const BORDER = '#E3E6ED';

const CHIP = {
  blue:   { bg: '#EFF6FF', fg: '#2563EB' },
  amber:  { bg: '#FFF7ED', fg: '#F59E0B' },
  green:  { bg: '#ECFDF5', fg: '#10B981' },
  slate:  { bg: '#F1F5F9', fg: '#64748B' },
  purple: { bg: '#F5F3FF', fg: '#8B5CF6' }
};

const TABS = [
  { id: 'inventario', icon: 'ti-package', label: 'Inventario' },
  { id: 'tienda', icon: 'ti-building-store', label: 'Tienda y cuenta' }
];

const PANELS = {
  inventario: {
    title: 'Inventario',
    desc: 'Moneda, umbrales de stock y almacenes.',
    groups: [
      { heading: 'Moneda y formato', chip: 'blue', rows: [
        { icon: 'ti-currency-dollar', label: 'Moneda principal', value: 'USD - Dólar', tag: 'Próximamente' },
        { icon: 'ti-hash', label: 'Formato de números', value: '1,234.56', tag: 'Próximamente' },
        { icon: 'ti-exchange', label: 'Tasa de cambio', sub: '1 USD = 3.4 soles', action: 'Editar' }
      ]},
      { heading: 'Stock bajo', chip: 'amber', rows: [
        { icon: 'ti-alert-triangle', label: 'Umbral de stock', sub: '3 unidades o menos', action: 'Editar' },
        { icon: 'ti-bell', label: 'Alerta en el dashboard', toggle: true }
      ]},
      { heading: 'Almacenes', chip: 'green', rows: [
        { icon: 'ti-building-warehouse', label: 'Almacén 1', sub: 'Principal', action: 'Editar' },
        { icon: 'ti-building-warehouse', label: 'Almacén 2', sub: 'AV UNIÓN', action: 'Editar' }
      ]}
    ]
  },
  tienda: {
    title: 'Tienda y cuenta',
    desc: 'Identidad de marca y preferencias del sistema.',
    groups: [
      { heading: 'Marca', chip: 'slate', rows: [
        { icon: 'ti-photo', label: 'Logo de la tienda', sub: 'Disponible desde el plan Medio', action: 'Subir', disabled: true }
      ]},
      { heading: 'Preferencias', chip: 'purple', rows: [
        { icon: 'ti-moon', label: 'Tema', value: 'Claro', action: 'Cambiar' },
        { icon: 'ti-language', label: 'Idioma', value: 'Español', tag: 'Próximamente' }
      ]},
      { heading: 'Soporte', chip: 'slate', rows: [
        { icon: 'ti-lifebuoy', label: 'Centro de ayuda', tag: 'Próximamente' },
        { icon: 'ti-mail', label: 'Contactar soporte', tag: 'Próximamente' }
      ]}
    ]
  }
};

function chipHtml(icon, chip) {
  const c = CHIP[chip] || CHIP.slate;
  return '<div style="width:30px;height:30px;border-radius:8px;background:' + c.bg + ';display:flex;align-items:center;justify-content:center;flex-shrink:0">' +
    '<i class="ti ' + icon + '" aria-hidden="true" style="font-size:15px;color:' + c.fg + '"></i></div>';
}

function rowHtml(r, chip) {
  let right = '';
  if (r.toggle) {
    right = '<div style="width:34px;height:20px;border-radius:999px;background:' + ACCENT + ';position:relative;flex-shrink:0"><div style="width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:2px;right:2px"></div></div>';
  } else if (r.tag) {
    right = '<span style="font-size:10.5px;font-weight:650;color:' + TEXT3 + ';background:#F7F8FB;border:1px solid ' + BORDER + ';border-radius:999px;padding:2px 9px;white-space:nowrap">' + r.tag + '</span>';
  } else if (r.action) {
    right = '<button style="font-size:12.5px;font-weight:600;height:28px;padding:0 12px;border-radius:8px;border:1px solid ' + (r.disabled ? BORDER : INK) + ';background:' + (r.disabled ? '#F7F8FB' : INK) + ';color:' + (r.disabled ? TEXT3 : '#fff') + ';cursor:' + (r.disabled ? 'not-allowed' : 'pointer') + '">' + r.action + '</button>';
  } else if (r.value) {
    right = '<span style="font-size:13px;color:' + TEXT2 + '">' + r.value + '</span>';
  }
  return '<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid ' + BORDER + '">' +
    '<div style="display:flex;align-items:center;gap:11px;min-width:0">' +
    chipHtml(r.icon, chip) +
    '<div style="min-width:0">' +
    '<div style="font-size:13.5px;color:' + INK + '">' + r.label + '</div>' +
    (r.sub ? '<div style="font-size:12px;color:' + TEXT3 + '">' + r.sub + '</div>' : '') +
    '</div></div>' +
    '<div style="display:flex;align-items:center;flex-shrink:0">' + right + '</div>' +
    '</div>';
}

function groupHtml(g) {
  const rows = g.rows.map(r => rowHtml(r, g.chip)).join('');
  return '<div style="margin-bottom:22px">' +
    '<div style="font-size:11px;font-weight:650;letter-spacing:0.05em;text-transform:uppercase;color:' + TEXT3 + ';margin-bottom:9px">' + g.heading + '</div>' +
    '<div style="background:#FFFFFF;border:1px solid ' + BORDER + ';border-radius:12px;padding:2px 16px 0">' + rows + '</div>' +
    '</div>';
}

function renderPanel(id) {
  const p = PANELS[id];
  document.getElementById('panelContent').innerHTML =
    '<div style="font-size:16px;font-weight:650;color:' + INK + ';margin-bottom:2px">' + p.title + '</div>' +
    '<div style="font-size:13px;color:' + TEXT3 + ';margin-bottom:18px">' + p.desc + '</div>' +
    p.groups.map(groupHtml).join('');
  document.querySelectorAll('#panelContent > div[style*="margin-bottom:22px"] > div[style*="border-radius:12px"]').forEach(box => {
    const last = box.lastElementChild;
    if (last) last.style.borderBottom = 'none';
  });
}

function renderNav(activeId) {
  const nav = document.getElementById('settingsNav');
  nav.innerHTML = TABS.map(t => {
    const active = t.id === activeId;
    return '<div data-tab="' + t.id + '" style="display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;font-size:13px;font-weight:' + (active ? '600' : '500') + ';cursor:pointer;' +
      (active ? 'background:' + ACCENT_SOFT + ';color:' + ACCENT + ';' : 'color:' + TEXT2 + ';') + '">' +
      '<i class="ti ' + t.icon + '" aria-hidden="true" style="font-size:16px"></i>' + t.label + '</div>';
  }).join('');
  nav.querySelectorAll('[data-tab]').forEach(el => {
    el.addEventListener('click', () => {
      renderNav(el.dataset.tab);
      renderPanel(el.dataset.tab);
    });
  });
}

renderNav('inventario');
renderPanel('inventario');
</script>
