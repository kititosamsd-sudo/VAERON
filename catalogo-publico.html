<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="stylesheet" href="variables.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Sin firebase-auth-compat.js a propósito: esta página nunca inicia
     sesión — solo hace una lectura pública de
     tiendas/{tienda}/catalogoPublico, permitida por las reglas
     mientras "activo" esté en true (ver database.rules.json). -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-projects.js"></script>
<style>
  /* =========================================================
     Catálogo público — VAERON
     =========================================================
     Página standalone (NO pasa por router.js/auth-guard.js): vive
     fuera de la SPA a propósito, porque la SPA entera asume una
     sesión iniciada (ver AUTH_READY en auth-guard.js). El link se
     arma en Configuración → Catálogo público
     (calcularLinkCatalogoPublico() en configuracion-logic.js) con
     dos parámetros en la URL: ?proyecto=xxx&tienda=yyy — "proyecto"
     dice a cuál de las bases de Firebase conectarse (ver
     firebase-projects.js) y "tienda" cuál nodo leer ahí adentro.

     Muestra SOLO nombre, foto y categoría de cada producto — nunca
     precio, costo ni stock. Esto no es una limitación de esta
     pantalla: el nodo catalogoPublico que lee ni siquiera TIENE esos
     campos (ver mirrorCatalogoPublicoProducto() en firebase.js), así
     que no hay nada que ocultar a último momento — la info sensible
     nunca llegó hasta acá.
     ========================================================= */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
  }
  .cp-header {
    background: var(--ink);
    color: #fff;
    padding: 28px 20px 24px;
    text-align: center;
  }
  .cp-header h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 800;
  }
  .cp-header p {
    margin: 0;
    font-size: 13px;
    color: rgba(255,255,255,0.65);
  }
  .cp-wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }
  .cp-search {
    width: 100%;
    max-width: 420px;
    margin: 0 auto 22px;
    display: block;
    padding: 11px 14px;
    border-radius: var(--r-lg);
    border: 1px solid var(--border);
    background: var(--surface);
    font-family: var(--font-ui);
    font-size: 14px;
    color: var(--text-1);
  }
  .cp-search:focus { outline: 2px solid var(--accent-border); }
  .cp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .cp-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .cp-thumb {
    aspect-ratio: 1 / 1;
    background: var(--surface-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .cp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cp-thumb svg { width: 34px; height: 34px; stroke: var(--text-3); fill: none; stroke-width: 1.5; }
  .cp-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .cp-cat { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.03em; }
  .cp-name { font-size: 13.5px; font-weight: 600; color: var(--text-1); line-height: 1.3; }
  .cp-ask {
    margin-top: auto;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 7px 10px;
    border-radius: var(--r-sm);
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
  }
  .cp-ask svg { width: 14px; height: 14px; }
  .cp-ask:hover { background: var(--green-bg); color: var(--green); border-color: var(--green); }
  .cp-empty, .cp-loading, .cp-error {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-3);
    font-size: 14px;
  }
  .cp-error { color: var(--red); }
  .cp-fab-wa {
    position: fixed;
    right: 18px;
    bottom: 18px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--green);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    text-decoration: none;
  }
  .cp-fab-wa svg { width: 26px; height: 26px; fill: #fff; }
  .cp-footer {
    text-align: center;
    padding: 24px 16px 40px;
    font-size: 11.5px;
    color: var(--text-3);
  }
</style>
</head>
<body>

<div class="cp-header">
  <h1 id="cpNombre">Catálogo</h1>
  <p id="cpSubtitulo">Cargando…</p>
</div>

<div class="cp-wrap">
  <input class="cp-search" id="cpSearchInput" type="text" placeholder="Buscar producto…" oninput="filtrarCatalogoPublico()" style="display:none">
  <div id="cpContenido">
    <p class="cp-loading">Cargando catálogo…</p>
  </div>
</div>

<a id="cpFabWa" class="cp-fab-wa" style="display:none" target="_blank" rel="noopener">
  <svg viewBox="0 0 24 24"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.69.44 3.34 1.28 4.79L2 22l5.44-1.43a9.9 9.9 0 0 0 4.6 1.17h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.87 9.87 0 0 0 12.04 2m0 1.67c2.2 0 4.27.86 5.82 2.42a8.2 8.2 0 0 1 2.41 5.82c0 4.54-3.7 8.24-8.24 8.24a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.84-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24m-4.6 4.64c-.16 0-.42.06-.64.31s-.85.83-.85 2.02.87 2.35.99 2.51c.12.16 1.7 2.6 4.13 3.63 2.02.86 2.44.7 2.88.65s1.42-.58 1.62-1.14.2-1.04.14-1.14-.22-.16-.46-.28-1.42-.7-1.64-.78-.38-.12-.54.12-.62.78-.76.94-.28.18-.52.06a6.6 6.6 0 0 1-1.94-1.2 7.3 7.3 0 0 1-1.34-1.67c-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42s.16-.24.24-.4.04-.3-.02-.42-.54-1.3-.74-1.78-.4-.4-.54-.41z"/></svg>
</a>

<div class="cp-footer">Catálogo por VAERON</div>

<script>
// ── Parámetros de la URL ──────────────────────────────────────────
const params = new URLSearchParams(location.search);
const paramProyecto = params.get('proyecto') || '';
const paramTienda = params.get('tienda') || '';

let cpProductos = [];
let cpWhatsapp = '';

function mostrarError(msg) {
  document.getElementById('cpSubtitulo').textContent = 'No disponible';
  document.getElementById('cpContenido').innerHTML = '<p class="cp-error">' + msg + '</p>';
}

if (!paramProyecto || !paramTienda || !FIREBASE_PROJECTS[paramProyecto]) {
  mostrarError('Este link no es válido. Pídele a la tienda que te comparta el link actualizado.');
} else {
  // App secundaria con nombre único — evita chocar si esta misma
  // pestaña por algún motivo ya tuviera otra app de Firebase
  // inicializada (no debería pasar en esta página standalone, pero
  // el mismo cuidado se toma en el resto del proyecto — ver
  // secondaryApp en firebase.js).
  const app = firebase.initializeApp(FIREBASE_PROJECTS[paramProyecto].config, 'CatalogoPublico');
  const db = app.database();

  db.ref('tiendas/' + paramTienda + '/catalogoPublico').once('value')
    .then(snap => {
      const data = snap.val();
      if (!data || data.activo !== true) {
        mostrarError('Esta tienda todavía no activó su catálogo público.');
        return;
      }

      document.getElementById('cpNombre').textContent = data.nombreTienda || 'Catálogo';

      const productosObj = data.productos || {};
      cpProductos = Object.keys(productosObj).map(code => ({
        code,
        nombre: productosObj[code].nombre || '',
        categoria: productosObj[code].categoria || 'Sin categoría',
        imagen: productosObj[code].imagen || ''
      })).filter(p => p.nombre);

      document.getElementById('cpSubtitulo').textContent =
        cpProductos.length + ' producto' + (cpProductos.length === 1 ? '' : 's');

      if (data.whatsapp) {
        cpWhatsapp = data.whatsapp;
        const waHref = 'https://wa.me/' + data.whatsapp.replace(/\D/g, '') +
          '?text=' + encodeURIComponent('Hola, vi su catálogo y quería consultar por un producto.');
        const fab = document.getElementById('cpFabWa');
        fab.href = waHref;
        fab.style.display = 'flex';
      }

      if (cpProductos.length > 6) {
        document.getElementById('cpSearchInput').style.display = 'block';
      }

      renderCatalogoPublico(cpProductos, cpWhatsapp);
    })
    .catch(() => {
      mostrarError('Esta tienda todavía no activó su catálogo público.');
    });
}

function escapeHtmlPublico(str) {
  return String(str || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function renderCatalogoPublico(lista, whatsapp) {
  const el = document.getElementById('cpContenido');
  if (!lista.length) {
    el.innerHTML = cpProductos.length
      ? '<p class="cp-empty">Ningún producto coincide con tu búsqueda.</p>'
      : '<p class="cp-empty">Todavía no hay productos publicados.</p>';
    return;
  }
  el.innerHTML = '<div class="cp-grid">' + lista.map(p => itemHtmlPublico(p, whatsapp)).join('') + '</div>';
}

function itemHtmlPublico(p, whatsapp) {
  const thumb = p.imagen
    ? `<img src="${p.imagen}" alt="" loading="lazy">`
    : `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>`;

  const askBtn = whatsapp
    ? `<a class="cp-ask" target="_blank" rel="noopener" href="https://wa.me/${whatsapp.replace(/\D/g, '')}?text=${encodeURIComponent('Hola, quería consultar por: ' + p.nombre)}">
         <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.69.44 3.34 1.28 4.79L2 22l5.44-1.43a9.9 9.9 0 0 0 4.6 1.17h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.87 9.87 0 0 0 12.04 2"/></svg>
         Preguntar
       </a>`
    : '';

  return `
    <div class="cp-item" data-nombre="${escapeHtmlPublico(p.nombre.toLowerCase())}">
      <div class="cp-thumb">${thumb}</div>
      <div class="cp-body">
        <span class="cp-cat">${escapeHtmlPublico(p.categoria)}</span>
        <span class="cp-name">${escapeHtmlPublico(p.nombre)}</span>
        ${askBtn}
      </div>
    </div>`;
}

function filtrarCatalogoPublico() {
  const q = document.getElementById('cpSearchInput').value.trim().toLowerCase();
  const filtrado = q ? cpProductos.filter(p => p.nombre.toLowerCase().includes(q)) : cpProductos;
  renderCatalogoPublico(filtrado, cpWhatsapp);
}
</script>
</body>
</html>
