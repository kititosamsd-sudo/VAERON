<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAERON</title>
<link rel="icon" href="favicon.png" type="image/png">
<!-- BLOQUEANTE A PROPÓSITO (sin defer/async): oculta la página de
     inmediato, antes de que el navegador pinte NADA. Esto es lo que
     realmente evita el "flash" de contenido sin sesión — depender
     solo de auth-guard.js (que es defer) no lo garantiza, porque
     ese script puede ejecutarse después de que el navegador ya
     pintó algo. Esta línea SIEMPRE corre primero. -->
<script>document.documentElement.style.visibility = 'hidden';</script>
<!-- Tema oscuro/claro: se aplica ANTES de que carguen las hojas de
     estilo, para que la primera pintura ya sea con el tema correcto
     (si esto corriera después, se vería un flash blanco→oscuro cada
     vez que alguien con tema oscuro guardado abre la app). -->
<script>
  try {
    if (localStorage.getItem('vaeron-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="stock-card.css">
<link rel="stylesheet" href="import.css">
<!-- SDK real de Firebase (compat) — conectado a los proyectos reales
     configurados en firebase-projects.js. mock-sdk.js queda guardado
     en el proyecto por si algún día hace falta volver a modo demo,
     pero ya no se carga acá.
     "defer" acá es la pieza que realmente acelera la carga: sin esto,
     el navegador para de parsear el resto de la página hasta bajar
     estos 3 archivos de gstatic.com UNO POR UNO, antes de poder
     empezar a pedir nada más (ni siquiera firebase.js). Con defer,
     los 3 se descargan EN PARALELO con todo lo demás, y solo se
     ejecutan en orden (éste, luego firebase-projects.js, luego
     firebase.js...) una vez que el HTML ya terminó de parsearse —
     mismo orden de ejecución de siempre, pero sin bloquear la carga
     mientras tanto. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js" defer></script>
</head>
<body>

      <!-- "Más" — solo aparece en la barra inferior (móvil) cuando el
           plan pagado agrega Catálogo/Pedidos/Foro/Registros y ya no
           entran las 8 secciones en una sola fila sin verse
           apretadas. Agrupa ahí lo que se usa con menos frecuencia
           en el día a día (Foro, Registros, Configuración, Perfil),
           dejando Dashboard/Stock/Catálogo/Pedidos siempre a un
           toque. En plan Básico (solo 4 secciones) o en desktop, no
           hace falta — ver reglas en base.css. -->
      <button type="button" class="nav-item nav-tienda-only nav-more-toggle" id="navMoreToggle"
        aria-haspopup="true" aria-expanded="false" aria-controls="navMorePanel" onclick="toggleNavMore()">

        Más
      </button>
    </nav>

    <!-- Panel del botón "Más" — mismos data-page que las versiones
         "reales" de arriba, así que el Router (setActiveNavItem) y el
         click-to-navigate de nav.js los reconocen sin código aparte. -->

        Registros

    <div class="sidebar-footer">
      <div class="user-card-wrap">

          <div class="avatar">AD</div>
          <div>
            <div class="user-name">Cargando…</div>
            <div class="user-role"></div>
          </div>
          <button class="user-menu-toggle" id="userMenuToggle" type="button" title="Opciones de cuenta" aria-label="Opciones de cuenta">

          </button>
        </div>
        <div class="user-menu" id="userMenu" style="display:none">

            Cerrar sesión

        </div>
      </div>
    </div>
  </aside>

  <!-- ── Aquí se inyecta cada vista (main + sus modales) ── -->
  <div id="viewRoot"></div>

</div>

<!-- Indicador chico de "cambiando de sección", NO pantalla en blanco -->
<div id="viewLoading" style="display:none;position:fixed;top:14px;right:14px;z-index:9999;background:var(--ink);color:#fff;padding:6px 14px;border-radius:999px;font-size:11.5px;font-weight:600;box-shadow:var(--shadow)">
  Cargando…
</div>

<script src="firebase-projects.js" defer></script>
<script src="firebase.js" defer></script>
<script src="plan-limits.js" defer></script>
<script src="i18n.js" defer></script>
<script defer>if (window.aplicarIdioma) aplicarIdioma(document);</script>
<script src="auth-guard.js" defer></script>
<script src="nav.js" defer></script>
<script src="selection.js" defer></script>
<script src="router.js" defer></script>

<!-- Lógica de cada sección — se cargan UNA sola vez, sus conexiones
     a Firebase quedan vivas para siempre mientras uses la app. -->
<script src="dashboard-logic.js" defer></script>
<script src="cloudinary.js" defer></script>
<script src="stock.js" defer></script>
<script src="catalogo-logic.js" defer></script>
<script src="foro-logic.js" defer></script>
<script src="import-stock.js" defer></script>
<script src="pedidos-logic.js" defer></script>
<script src="import-clientes.js" defer></script>
<script src="registros-logic.js" defer></script>
<script src="configuracion-logic.js" defer></script>
<script src="perfil-logic.js" defer></script>
<script src="tiendas-logic.js" defer></script>
<script src="facturacion-logic.js" defer></script>
<script src="auditoria-logic.js" defer></script>
<script src="config-sistema-logic.js" defer></script>

<script defer>
  document.addEventListener('DOMContentLoaded', () => {
    authReady.then(({ role }) => {
      // Si no hay una sección específica en la URL (#stock, #perfil...),
      // cada rol entra a su pantalla de inicio: el súper-admin a
      // "Tiendas" (administra las cuentas), las cuentas de una tienda
      // al Catálogo — nunca al panel del otro.
      if (!window.location.hash) {
        window.location.hash = role === 'superadmin' ? '#tiendas' : '#dashboard';
      }
      Router.start();
    });
  });
</script>
</body>
</html>
